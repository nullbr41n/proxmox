apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-proxmox-csi
  namespace: proxmox-csi-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-data-xfs
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: test-proxmox-csi
  namespace: proxmox-csi-test
spec:
  restartPolicy: Always
  containers:
    - name: shell
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          echo "proxmox-csi smoke test" > /data/hello.txt
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: test-proxmox-csi
